name: Patch password sync

on:
  push:
    paths:
      - 'scripts/patch_password_sync.py'
      - '.github/workflows/patch-password-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Code.gs
        run: python scripts/patch_password_sync.py

      - name: Commit patched backend
        run: |
          if git diff --quiet -- Code.gs; then
            echo "Code.gs already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Code.gs
          git commit -m "Đồng bộ mật khẩu tạm với đăng nhập app"
          git push
